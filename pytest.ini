# 项目根 pytest 配置——统一管理 feishu/ 和 backend/ 测试
# backend 有自己的 pyproject.toml（cd backend && pytest），本文件管 feishu/ 和根目录测试
[tool.pytest.ini_options]
testpaths = ["feishu/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "live: 联网冒烟测试（默认跳过）",
]
addopts = [
    "-m", "not live",
    "--tb=short",
]
