[tool.pytest.ini_options]
# S016 测试网：pytest 配置（原 pytest.ini 迁移至此——TOML 固定 UTF-8，
# 避免 GBK 系统下 iniconfig 解析中文注释崩溃）。
# 离线快测默认跳过 live（联网冒烟），与 CLAUDE.md §测试命令一致：
#   cd backend && .venv/Scripts/python.exe -m pytest
# （pyproject.toml 被 pytest 自动发现，addopts 即默认参数）
#
# live marker 在 conftest.py:pytest_configure 中注册（唯一出处）。
# 默认参数：跳过 live、按 backend 目录测覆盖率、输出未覆盖行号。
# 注：backend 模块为扁平布局（无 backend 包），故 --cov=. 覆盖 cwd 下所有 .py；
# .venv / data 等通过同目录 .coveragerc exclude 排除。
# 纯函数门槛（--cov-fail-under）：本地 venv 已装 lightgbm/mapie/catboost，
# 纯计算测试可跑全。当前整体覆盖率 62.5%（2026-11-08 全量跑验证）（基线），设 50 作为防回归门槛
# （目标 80，先锁基线防回退，逐模块提升——见 S016 tasks T13 / spec R3）。
addopts = [
    "-m", "not live",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-config=.coveragerc",
    "--cov-fail-under=50",
]

testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E402", "E702", "E741", "F821", "F841", "E731", "E501", "F401"]  # 暂忽略历史遗留，真实bug已全修（F811/F821/F404/F841=0）

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E", "F", "W"]
"tools/*" = ["E", "F", "W"]
"archive_audit/*" = ["E", "F", "W"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = []
quote-annotations = true
