services:
  backend:
    build: ./backend
    container_name: vr-backend
    ports:
      - "8900:8900"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - LIMITUP_PRECOMPUTE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: vr-frontend
    ports:
      - "5899:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # OmniRoute 托底网关（默认跟随启动）
  # 如需禁用，可在 backend/.env 中设置 VR_OMNIRoute_ENABLED=false
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: vr-omniroute
    ports:
      - "20128:20128"
    environment:
      - NODE_ENV=production
      - INITIAL_PASSWORD=${OMNIRoute_PASSWORD:-changeme}
    restart: unless-stopped
