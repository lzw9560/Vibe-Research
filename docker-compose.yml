services:
  backend:
    build: ./backend
    container_name: vr-backend
    ports:
      - "8900:8900"
    env_file:
      - path: ./backend/.env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: vr-frontend
    ports:
      - "5899:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
