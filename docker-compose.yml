services:
  backend:
    build: ./backend
    container_name: vr-backend
    ports:
      - "8900:8900"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - LIMITUP_PRECOMPUTE=true
      - VR_DATA_DIR=/app/.vibe-research
    volumes:
      - ./.vibe-research:/app/.vibe-research  # 数据持久化（market_data.db + trade_journal.db + baostock cache + gene_scores 等）
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8900/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: vr-frontend
    ports:
      - "5899:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

